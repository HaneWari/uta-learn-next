# One service on purpose: the API also serves the built SPA, exactly like dev.cmd
# does. The image builds the frontend itself, so the build context is the repo
# root rather than backend/.
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    # writable: uploads, generated datasets and exports all live here
    volumes:
      - ./localdata:/data
      - ./exports:/exports
    environment:
      - DATA_DIR=/data
      - EXPORT_DIR=/exports
    restart: unless-stopped
